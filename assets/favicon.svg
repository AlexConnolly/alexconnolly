  <rect x="9"  y="6"    width="7" height="24"   fill="#E0006C"/>
  <rect x="16" y="19.4" width="7" height="10.6" fill="#F5B800"/>
  <rect x="23" y="10.8" width="7" height="19.2" fill="#14130F"/>
</svg>
